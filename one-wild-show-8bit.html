<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Wild World of College Football Playoffs on ESPN: 8-bit prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece8f6;--fg:#1b1433;--muted:#5b5378;--frame:#1b1433;--glow:rgba(106,63,214,.25);--accent:#8a6417}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#07051a;--fg:#f4f1ff;--muted:#9a92c9;--frame:#000;--glow:rgba(106,63,214,.45);--accent:#e9c45a}}
:root[data-theme="dark"]{--bg:#07051a;--fg:#f4f1ff;--muted:#9a92c9;--frame:#000;--glow:rgba(106,63,214,.45);--accent:#e9c45a}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:"Press Start 2P",ui-monospace,Menlo,Consolas,monospace}
.wrap{max-width:1180px;margin:0 auto;padding:12px 12px 16px}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:0 auto 12px;width:min(100%,max(320px,calc((100vh - 120px)*16/9)));width:min(100%,max(320px,calc((100dvh - 120px)*16/9)))}
.bar h1{font-size:12px;line-height:1.4;margin:0;font-weight:400}
.bar h1 span{color:var(--muted);font-size:9px;margin-left:8px}
#mute{font:inherit;font-size:9px;background:transparent;color:var(--fg);border:2px solid var(--fg);border-radius:4px;padding:8px 10px;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.stage{position:relative;margin:0 auto;width:min(100%,max(320px,calc((100vh - 120px)*16/9)));width:min(100%,max(320px,calc((100dvh - 120px)*16/9)))}
canvas{display:block;width:100%;height:auto;aspect-ratio:16/9;image-rendering:crisp-edges;image-rendering:pixelated;background:#000;border-radius:6px;box-shadow:0 0 0 3px var(--frame),0 12px 48px var(--glow);touch-action:none}
.stage{container-type:inline-size}
#setup{position:absolute;left:50%;top:69%;transform:translateX(-50%);display:flex;gap:4cqw;align-items:center;white-space:nowrap}
#setup[hidden]{display:none}
#setup label{display:flex;align-items:center;gap:1.4cqw;color:#e9c45a;font-size:10px;font-size:2.5cqw}
#setup input{font:inherit;font-size:10px;font-size:2.5cqw;background:#0b0820;color:#fff;border:2px solid #e9c45a;border-radius:3px;padding:.55em .6em;text-transform:uppercase}
#setup input::placeholder{color:#5b5378}
#nameIn{width:11.5em}#numIn{width:3.4em;text-align:center}
#setup input:focus-visible{outline:2px solid #fff;outline-offset:2px}
#cardBtn{position:absolute;left:50%;bottom:7%;transform:translateX(-50%);font:inherit;font-size:clamp(8px,1.3vw,12px);padding:1em 1.4em;border-radius:6px;border:3px solid #160d22;background:#e9c45a;color:#160d22;cursor:pointer;box-shadow:0 4px 0 #8a6417;white-space:nowrap}
#cardBtn:active{transform:translateX(-50%) translateY(2px);box-shadow:0 2px 0 #8a6417}
#cardBtn[hidden]{display:none}
.legend{color:var(--muted);font-size:9px;line-height:2;text-align:center;margin:14px auto 0;max-width:72ch}
.legend b{color:var(--fg);font-weight:400}
.pad{display:none}
.hint{display:none}
@media (pointer:coarse){
 .pad{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-top:16px;user-select:none;-webkit-user-select:none;touch-action:none}
 .legend{display:none}
 .hint{display:block;color:var(--muted);font-size:8px;text-align:center;margin-top:14px;line-height:1.8}
}
@media (pointer:coarse) and (orientation:landscape){
 .bar,.hint{display:none}
 .wrap{padding:6px}
 .stage{width:min(100%,calc((100vh - 16px)*16/9));width:min(100%,calc((100dvh - 16px)*16/9))}
 .pad{position:absolute;left:10px;right:10px;bottom:10px;margin:0;pointer-events:none}
 .pad button{pointer-events:auto;opacity:.6}
}
.dpad,.ab{display:flex;gap:8px}
.pad button{width:58px;height:58px;border-radius:12px;border:2px solid rgba(255,255,255,.35);background:rgba(20,12,50,.8);color:#fff;font:inherit;font-size:14px;touch-action:none;-webkit-tap-highlight-color:transparent}
.pad .ab button{border-radius:50%;width:66px;height:66px;font-size:13px}
.pad .a{background:rgba(233,196,90,.92);color:#1b1433}
.pad .b{background:rgba(216,40,60,.9)}
.pad small{display:block;font-size:6px;margin-top:4px}
.pad button.on{transform:scale(.93);filter:brightness(1.35)}
</style>
</head>
<body>
<main class="wrap">
 <div class="bar">
  <h1>The Wild World of College Football Playoffs on ESPN <span>8-bit prototype</span></h1>
  <button id="mute" type="button">Sound on</button>
 </div>
 <div class="stage">
  <canvas id="game" width="320" height="180" aria-label="The Wild World of College Football Playoffs on ESPN, an 8-bit side-scroller game"></canvas>
  <button id="cardBtn" type="button" hidden>Download fan card</button>
  <div id="setup" hidden><label for="nameIn">NAME <input id="nameIn" maxlength="10" autocomplete="off" spellcheck="false" placeholder="YOUR NAME"></label><label for="numIn">NO. <input id="numIn" maxlength="2" inputmode="numeric" autocomplete="off" placeholder="00"></label></div>
  <div class="pad">
   <div class="dpad"><button data-k="left" aria-label="Move left">◀</button><button data-k="duck" aria-label="Duck">▼</button><button data-k="right" aria-label="Move right">▶</button></div>
   <div class="ab"><button data-k="throw" class="b" aria-label="Throw">B<small>throw</small></button><button data-k="jump go" class="a" aria-label="Jump">A<small>jump</small></button></div>
  </div>
 </div>
 <p class="legend"><b>←/→</b> or <b>A/D</b> move &nbsp; <b>↓/S</b> duck &nbsp; <b>Z/↑/W</b> jump &nbsp; <b>Space/J</b> throw &nbsp; <b>Enter</b> pause &nbsp; <b>M</b> mute</p>
 <p class="hint">Turn your phone sideways for a bigger field.</p>
</main>
<script>
(()=>{'use strict';
const W=320,H=180,GY=156,MAXL=5;
const cv=document.getElementById('game');const cx=cv.getContext('2d');cx.imageSmoothingEnabled=false;

const hazeG=cx.createLinearGradient(0,90,0,GY);hazeG.addColorStop(0,'rgba(10,8,30,0)');hazeG.addColorStop(1,'rgba(10,8,30,0.35)');

 if(!K.jump&&p.vy<-2.2)p.vy=-2.2;

   else{damage(e,1);b.dead=true;}
   break;}
  if(!b.dead&&!b.blocked)for(const s of shots){if(!s.dead&&!s.landed&&(s.kind==='bag'||s.kind==='card'||s.kind==='flag')&&hit(b,s)){s.dead=true;b.dead=true;burst(s.x,s.y,['#fff','#ffd23f'],6);break;}}}

function makeCard(){
 const bw=216,bh=270,c=document.createElement('canvas');c.width=bw;c.height=bh;const g=c.getContext('2d');g.imageSmoothingEnabled=false;
 const gr=g.createLinearGradient(0,0,0,bh);gr.addColorStop(0,'#060920');gr.addColorStop(0.55,'#1c1640');gr.addColorStop(1,'#0b0820');g.fillStyle=gr;g.fillRect(0,0,bw,bh);
 g.globalAlpha=0.5;g.drawImage(skyline,120,0,216,56,0,52,216,56);g.globalAlpha=0.4;g.drawImage(crowdTile,0,0,216,48,0,108,216,48);g.globalAlpha=1;
 g.fillStyle=team.j;g.fillRect(0,156,bw,3);g.fillStyle=team.a;g.fillRect(0,159,bw,1);
 g.globalCompositeOperation='lighter';
 for(const lx of [24,192]){const rg=g.createRadialGradient(lx,62,2,lx,62,70);rg.addColorStop(0,'rgba(255,245,210,0.32)');rg.addColorStop(1,'rgba(255,245,210,0)');g.fillStyle=rg;g.fillRect(lx-70,-8,140,140);}
 g.fillStyle='rgba(255,245,210,0.12)';g.beginPath();g.moveTo(100,56);g.lineTo(116,56);g.lineTo(156,154);g.lineTo(60,154);g.closePath();g.fill();
 g.globalCompositeOperation='source-over';
 g.fillStyle='rgba(0,0,0,0.35)';g.beginPath();g.ellipse(108,154,34,4,0,0,Math.PI*2);g.fill();
 const t=(s,x,y,col,size,al)=>{g.font=(size||8)+'px '+FONT;g.textAlign=al||'center';g.textBaseline='top';g.fillStyle='#000';g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y);};
 drawTitleText(g,8,12,bw);
 t('OF COLLEGE FOOTBALL',108,23,'#fff');
 {const pw=96,gw=pw+logoW(10),gx=Math.round(108-gw/2);t('PLAYOFFS ON ',gx,34,'#fff',8,'left');drawLogo(g,10,gx+pw,33);}
 t(playerName?(playerName+(playerNum?' #'+playerNum:'')):(playerNum?'FAN #'+playerNum:'FAN CARD'),108,48,'#e9c45a');
 g.drawImage((playerNum?S.pnos:S.pstand)[0],72,58,72,96);if(playerNum)numText(g,playerNum,108,101,16);g.drawImage(S.ball1,138,106,21,12);
 const chips=[team.j,team.a,team.p];for(let i=0;i<3;i++){const x=78+i*22;g.fillStyle='#fff';g.fillRect(x-1,165,18,10);g.fillStyle=chips[i];g.fillRect(x,166,16,8);}
 t(presetName()==='CUSTOM'?'CUSTOM COLORS':presetName(),108,180,'#cfc6e8');
 const won=state==='win';
 t(won?'RESULT':'REACHED THE',108,196,'#9a92c9');
 t(won?'NATIONAL CHAMPS!':LEVELS[lvIdx].name,108,208,won?'#e9c45a':'#fff');
 t('SCORE',108,224,'#9a92c9');t(String(score).padStart(6,'0'),108,236,'#e9c45a',16);
 g.strokeStyle='#e9c45a';g.lineWidth=2;g.strokeRect(3,3,bw-6,bh-6);g.strokeStyle=team.j;g.lineWidth=1;g.strokeRect(6.5,6.5,bw-13,bh-13);
 const big=document.createElement('canvas');big.width=bw*5;big.height=bh*5;const bgc=big.getContext('2d');bgc.imageSmoothingEnabled=false;bgc.drawImage(c,0,0,big.width,big.height);
 return big;
}
function saveCard(){
 if(!DL||cardBtn.disabled)return;
 cardBtn.disabled=true;setBtn('Preparing card');
 const name='wild-world-cfp-'+((playerName||'fan').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'fan')+(playerNum?'-'+playerNum:'')+'.png';
 makeCard().toBlob(async blob=>{
  try{
   if(!blob)throw {code:'bad_request'};
   if(DL==='anchor'){const u=URL.createObjectURL(blob);const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),3000);}
   else await DL.save({filename:name,data:blob});
   setBtn('Card saved');
  }catch(err){const code=err&&err.code;
   if(code==='declined')setBtn('Download fan card');
   else if(code==='rate_limited')setBtn('Try again in a moment');
   else{DL=null;cardBtn.hidden=true;}
  }finally{cardBtn.disabled=false;}
 },'image/png');
}

/* ---------- loop ---------- */
let last=performance.now(),acc=0;const DT=1000/60;
function loop(now){acc+=Math.min(100,now-last);last=now;while(acc>=DT){step();acc-=DT;}draw();requestAnimationFrame(loop);}
const fontReady=document.fonts&&document.fonts.load?document.fonts.load('8px "Press Start 2P"').catch(()=>{}):Promise.resolve();
Promise.race([fontReady,new Promise(r=>setTimeout(r,1500))]).then(()=>requestAnimationFrame(t=>{last=t;loop(t);}));
})();
</script>
